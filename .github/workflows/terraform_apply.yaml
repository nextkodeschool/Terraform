name: Terraform-IaC
on:
  push:
    branches:
      - batch/july26

jobs:
  deploy:
    name: Deploy Dev Environment
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: exercise4/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4        

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1   
          
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Plan infrastructure changes
        run: terraform plan -input=false -var-file="dev.tfvars"

      - name: Apply infrastructure changes
        run: terraform apply -input=false -var-file="dev.tfvars" -auto-approve        

      - name: Delete infrastructure changes
        run: terraform destroy -input=false -var-file="dev.tfvars" -auto-approve           
                  
         
          
