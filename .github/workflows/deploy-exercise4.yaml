name: Deploy Exercise 4

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - qa
          - prod

permissions:
  contents: read

concurrency:
  group: exercise4-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: exercise4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Select Terraform workspace
        run: terraform workspace select "${{ inputs.environment }}" || terraform workspace new "${{ inputs.environment }}"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Plan infrastructure changes
        run: terraform plan -input=false -var-file="${{ inputs.environment }}.tfvars" -out=tfplan

      - name: Apply infrastructure changes
        run: terraform apply -input=false -auto-approve tfplan
